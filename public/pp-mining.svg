<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="PointPro live PP coin mining machine">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050d18"/><stop offset=".48" stop-color="#102b4b"/><stop offset="1" stop-color="#030912"/></linearGradient>
 <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4a5b6e"/><stop offset=".35" stop-color="#1c2938"/><stop offset="1" stop-color="#080d14"/></linearGradient>
 <linearGradient id="steel2" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#26384b"/><stop offset="1" stop-color="#0a121d"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff8bf"/><stop offset=".28" stop-color="#ffd83d"/><stop offset=".72" stop-color="#f0a800"/><stop offset="1" stop-color="#b96700"/></linearGradient>
 <linearGradient id="belt" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#202d3b"/><stop offset="1" stop-color="#0b1119"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
 <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#77a9e8" stroke-opacity=".07"/></pattern>
 <style>
  .coin{transform-box:fill-box;transform-origin:center;animation:coinMove 4.8s cubic-bezier(.2,.55,.25,1) infinite}
  .coin.c2{animation-delay:1.2s}.coin.c3{animation-delay:2.4s}.coin.c4{animation-delay:3.6s}
  .coin.c5{animation-delay:.6s}.coin.c6{animation-delay:1.8s}
  @keyframes coinMove{0%{transform:translate(-65px,12px) scale(.38) rotate(-22deg);opacity:0}9%{opacity:1}22%{transform:translate(10px,0) scale(1) rotate(8deg);opacity:1}55%{transform:translate(190px,-1px) scale(.96) rotate(-8deg);opacity:1}82%{transform:translate(360px,4px) scale(.78) rotate(12deg);opacity:.85}100%{transform:translate(485px,10px) scale(.48) rotate(28deg);opacity:0}}
  .beltMove{animation:beltMove .9s linear infinite}@keyframes beltMove{to{transform:translateX(-48px)}}
  .roller{animation:roller 1.1s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes roller{to{transform:rotate(360deg)}}
  .pulse{animation:pulse 1.4s ease-in-out infinite}.p2{animation-delay:.35s}.p3{animation-delay:.7s}.p4{animation-delay:1.05s}
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(.86)}50%{opacity:1;transform:scale(1)}}
  .scan{animation:scan 2.8s linear infinite}@keyframes scan{0%{transform:translateX(-110px);opacity:0}15%{opacity:.9}85%{opacity:.9}100%{transform:translateX(150px);opacity:0}}
  .signal{animation:sig 2.4s ease-in-out infinite}.s2{animation-delay:.6s}.s3{animation-delay:1.2s}.s4{animation-delay:1.8s}
  @keyframes sig{0%,18%,100%{opacity:.22;filter:none}8%,12%{opacity:1;filter:url(#glow)}}
  .chartLine{stroke-dasharray:8 8;animation:dash 2.2s linear infinite}@keyframes dash{to{stroke-dashoffset:-48}}
  .spark{animation:spark 1.8s ease-out infinite}.sp2{animation-delay:.45s}.sp3{animation-delay:.9s}.sp4{animation-delay:1.35s}
  @keyframes spark{0%{opacity:0;transform:translateY(5px) scale(.4)}25%{opacity:1}100%{opacity:0;transform:translateY(-25px) scale(1)}}
 </style>
</defs>

<rect width="900" height="560" rx="38" fill="url(#bg)"/>
<rect x="18" y="18" width="864" height="524" rx="30" fill="url(#grid)"/>
<ellipse cx="445" cy="460" rx="390" ry="46" fill="#000" opacity=".42" filter="url(#soft)"/>

<!-- Industrial mining engine -->
<g transform="translate(42 72)">
 <rect x="0" y="0" width="330" height="365" rx="28" fill="url(#steel)" stroke="#60758b" stroke-width="3"/>
 <rect x="12" y="12" width="306" height="341" rx="21" fill="none" stroke="#8aa0b8" stroke-opacity=".16" stroke-width="2"/>
 <circle cx="27" cy="27" r="5" fill="#27df78" class="pulse"/><circle cx="303" cy="27" r="5" fill="#2f70f4" class="pulse p2"/>
 <text x="165" y="48" fill="#f7fbff" font-family="Arial,sans-serif" font-size="22" font-weight="900" text-anchor="middle">PP MINING ENGINE</text>
 <text x="165" y="70" fill="#8fa8c4" font-family="Arial,sans-serif" font-size="11" letter-spacing="2" text-anchor="middle">HIGH PERFORMANCE • LIVE CORE</text>

 <!-- reactor window -->
 <rect x="42" y="96" width="246" height="118" rx="18" fill="#050b13" stroke="#35516f" stroke-width="3"/>
 <rect x="55" y="109" width="220" height="92" rx="12" fill="#071426"/>
 <circle cx="103" cy="154" r="28" fill="#0d2947" stroke="#2f70f4" stroke-width="4"/>
 <circle cx="227" cy="154" r="28" fill="#0d2947" stroke="#2f70f4" stroke-width="4"/>
 <circle cx="103" cy="154" r="10" fill="#48a6ff" opacity=".65" class="pulse"/>
 <circle cx="227" cy="154" r="10" fill="#48a6ff" opacity=".65" class="pulse p2"/>
 <path d="M132 154h66" stroke="#4db0ff" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
 <path d="M150 128v52M178 128v52" stroke="#1d5ca0" stroke-width="2" opacity=".55"/>

 <!-- status / four signal lights -->
 <rect x="42" y="232" width="246" height="92" rx="16" fill="#07111e" stroke="#304b67"/>
 <text x="58" y="255" fill="#8fa8c4" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">MINING SIGNAL</text>
 <g transform="translate(65 273)">
  <circle cx="0" cy="0" r="13" fill="#3a0d14" stroke="#ff4557" stroke-width="2" class="signal"/>
  <circle cx="53" cy="0" r="13" fill="#092c4b" stroke="#3c9bff" stroke-width="2" class="signal s2"/>
  <circle cx="106" cy="0" r="13" fill="#3a0d14" stroke="#ff4557" stroke-width="2" class="signal s3"/>
  <circle cx="159" cy="0" r="13" fill="#073c27" stroke="#27df78" stroke-width="2" class="signal s4"/>
  <text x="0" y="31" fill="#ff6673" font-family="Arial,sans-serif" font-size="8" text-anchor="middle">RED</text>
  <text x="53" y="31" fill="#62b4ff" font-family="Arial,sans-serif" font-size="8" text-anchor="middle">BLUE</text>
  <text x="106" y="31" fill="#ff6673" font-family="Arial,sans-serif" font-size="8" text-anchor="middle">RED</text>
  <text x="159" y="31" fill="#46e991" font-family="Arial,sans-serif" font-size="8" text-anchor="middle">GREEN</text>
 </g>
 <text x="165" y="346" fill="#eaf2ff" font-family="Arial,sans-serif" font-size="15" font-weight="800" text-anchor="middle">+0.00124 PP/s</text>

 <!-- side vents -->
 <g opacity=".5" stroke="#9ab1c8" stroke-width="3" stroke-linecap="round">
  <path d="M25 120h7M25 135h7M25 150h7M25 165h7M298 120h7M298 135h7M298 150h7M298 165h7"/>
 </g>
</g>

<!-- Conveyor -->
<g transform="translate(325 340)">
 <rect x="0" y="0" width="535" height="96" rx="24" fill="url(#steel2)" stroke="#5b7189" stroke-width="3"/>
 <rect x="18" y="18" width="499" height="54" rx="14" fill="url(#belt)" stroke="#263a50" stroke-width="2"/>
 <g class="beltMove" opacity=".9">
  <path d="M10 45h36M82 45h36M154 45h36M226 45h36M298 45h36M370 45h36M442 45h36M514 45h36" stroke="#ffc928" stroke-width="7" stroke-linecap="round"/>
 </g>
 <g class="roller">
  <circle cx="42" cy="84" r="17" fill="#111a25" stroke="#61778c" stroke-width="3"/><path d="M42 72v24M30 84h24" stroke="#72879a" stroke-width="2"/>
 </g>
 <g class="roller" style="animation-delay:-.25s">
  <circle cx="492" cy="84" r="17" fill="#111a25" stroke="#61778c" stroke-width="3"/><path d="M492 72v24M480 84h24" stroke="#72879a" stroke-width="2"/>
 </g>
 <text x="268" y="31" fill="#8fa8c4" font-family="Arial,sans-serif" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="2">LIVE COLLECTION CONVEYOR</text>
</g>

<!-- Coins -->
<g class="coin"><circle cx="340" cy="385" r="31" fill="url(#gold)" stroke="#fff2a0" stroke-width="3"/><circle cx="340" cy="385" r="23" fill="none" stroke="#c88700" stroke-opacity=".55"/><text x="340" y="395" fill="#7a4b00" font-family="Arial,sans-serif" font-size="24" font-weight="900" text-anchor="middle">PP</text></g>
<g class="coin c2"><circle cx="340" cy="385" r="31" fill="url(#gold)" stroke="#fff2a0" stroke-width="3"/><circle cx="340" cy="385" r="23" fill="none" stroke="#c88700" stroke-opacity=".55"/><text x="340" y="395" fill="#7a4b00" font-family="Arial,sans-serif" font-size="24" font-weight="900" text-anchor="middle">PP</text></g>
<g class="coin c3"><circle cx="340" cy="385" r="31" fill="url(#gold)" stroke="#fff2a0" stroke-width="3"/><circle cx="340" cy="385" r="23" fill="none" stroke="#c88700" stroke-opacity=".55"/><text x="340" y="395" fill="#7a4b00" font-family="Arial,sans-serif" font-size="24" font-weight="900" text-anchor="middle">PP</text></g>
<g class="coin c4"><circle cx="340" cy="385" r="31" fill="url(#gold)" stroke="#fff2a0" stroke-width="3"/><circle cx="340" cy="385" r="23" fill="none" stroke="#c88700" stroke-opacity=".55"/><text x="340" y="395" fill="#7a4b00" font-family="Arial,sans-serif" font-size="24" font-weight="900" text-anchor="middle">PP</text></g>
<g class="coin c5"><circle cx="340" cy="385" r="31" fill="url(#gold)" stroke="#fff2a0" stroke-width="3"/><circle cx="340" cy="385" r="23" fill="none" stroke="#c88700" stroke-opacity=".55"/><text x="340" y="395" fill="#7a4b00" font-family="Arial,sans-serif" font-size="24" font-weight="900" text-anchor="middle">PP</text></g>
<g class="coin c6"><circle cx="340" cy="385" r="31" fill="url(#gold)" stroke="#fff2a0" stroke-width="3"/><circle cx="340" cy="385" r="23" fill="none" stroke="#c88700" stroke-opacity=".55"/><text x="340" y="395" fill="#7a4b00" font-family="Arial,sans-serif" font-size="24" font-weight="900" text-anchor="middle">PP</text></g>

<!-- Trading-style signal monitor -->
<g transform="translate(565 72)">
 <rect x="0" y="0" width="295" height="236" rx="24" fill="#07111e" stroke="#3d668d" stroke-width="2"/>
 <text x="22" y="35" fill="#fff" font-family="Arial,sans-serif" font-size="19" font-weight="900">LIVE SIGNAL</text>
 <circle cx="266" cy="29" r="7" fill="#27df78" class="pulse"/>
 <text x="22" y="56" fill="#7893b1" font-family="Arial,sans-serif" font-size="9" letter-spacing="1.5">MINING ENGINE TELEMETRY</text>
 <rect x="20" y="76" width="255" height="112" rx="14" fill="#06101c" stroke="#203a54"/>
 <path d="M31 159 L60 143 L83 150 L108 117 L132 133 L155 103 L179 119 L202 92 L226 110 L248 78 L266 88" fill="none" stroke="#5db3ff" stroke-width="3" class="chartLine"/>
 <path d="M31 159 L60 143 L83 150 L108 117 L132 133 L155 103 L179 119 L202 92 L226 110 L248 78 L266 88 V176 H31Z" fill="#2f70f4" opacity=".08"/>
 <line x1="31" y1="176" x2="266" y2="176" stroke="#38516a" stroke-width="1"/>
 <g class="scan"><rect x="0" y="78" width="3" height="100" fill="#27df78" filter="url(#glow)"/></g>
 <g transform="translate(20 208)">
  <circle cx="8" cy="0" r="5" fill="#ff4557"/><text x="18" y="4" fill="#a9bdd2" font-family="Arial,sans-serif" font-size="9">RED</text>
  <circle cx="75" cy="0" r="5" fill="#3c9bff"/><text x="85" y="4" fill="#a9bdd2" font-family="Arial,sans-serif" font-size="9">BLUE</text>
  <circle cx="145" cy="0" r="5" fill="#ff4557"/><text x="155" y="4" fill="#a9bdd2" font-family="Arial,sans-serif" font-size="9">RED</text>
  <circle cx="215" cy="0" r="5" fill="#27df78"/><text x="225" y="4" fill="#a9bdd2" font-family="Arial,sans-serif" font-size="9">GREEN</text>
 </g>
</g>

<!-- Collection stats -->
<g transform="translate(565 326)">
 <rect x="0" y="0" width="295" height="110" rx="22" fill="#07111e" stroke="#294c6c" stroke-width="2"/>
 <text x="22" y="29" fill="#7f9ab6" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.2">COLLECTED THIS CYCLE</text>
 <text x="22" y="62" fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="900">+0.00124 PP</text>
 <text x="22" y="87" fill="#27df78" font-family="Arial,sans-serif" font-size="11" font-weight="700">● ENGINE RUNNING</text>
 <circle cx="246" cy="55" r="23" fill="#27df78" opacity=".08"/>
 <circle cx="246" cy="55" r="8" fill="#27df78" class="pulse"/>
</g>

<!-- sparks near output -->
<g fill="#ffd83d">
 <circle class="spark" cx="356" cy="365" r="3"/><circle class="spark sp2" cx="377" cy="355" r="2.5"/><circle class="spark sp3" cx="398" cy="368" r="3"/><circle class="spark sp4" cx="420" cy="360" r="2.5"/>
</g>
</svg>