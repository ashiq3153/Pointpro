name: Enable Telegram Login

on:
  push:
    paths:
      - .github/workflows/enable-telegram-login.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch PointPro auth screen
        run: python scripts/patch_telegram_login.py

      - name: Build check
        run: |
          npm ci
          npm run build

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/PointProApp.tsx components/TelegramLoginButton.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Add Telegram sign in to PointPro'
          git push
