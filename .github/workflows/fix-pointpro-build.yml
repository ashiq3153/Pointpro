name: One-time PointPro build fix

on:
  push:

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix PointPro duplicate daily identifier'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix duplicate daily identifiers
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/PointProApp.tsx')
          s = p.read_text()
          s = s.replace('const [daily,setDaily]=useState<any>(null),[dailyLoading,setDailyLoading]=useState(false);', 'const [dailyReward,setDailyReward]=useState<any>(null),[dailyLoading,setDailyLoading]=useState(false);')
          s = s.replace('setDaily(data)', 'setDailyReward(data)')
          s = s.replace('setDaily({reward_day:data.day', 'setDailyReward({reward_day:data.day')
          s = s.replace('daily?.claim_date', 'dailyReward?.claim_date')
          s = s.replace('daily?.reward_day', 'dailyReward?.reward_day')
          s = s.replace('const daily=p.speed*86400;', 'const dailyEarnings=p.speed*86400;')
          s = s.replace('{daily.toFixed(2)} PP', '{dailyEarnings.toFixed(2)} PP')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/PointProApp.tsx .github/workflows/fix-pointpro-build.yml
          git rm .github/workflows/fix-pointpro-build.yml
          git commit -m 'Fix PointPro duplicate daily identifier' || exit 0
          git push
