name: Fix Profile crash

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-profile:
    if: ${{ !contains(github.event.head_commit.message, 'Fix Profile crash') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch profile props and missing icon import
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/PointProApp.tsx')
          s = p.read_text()
          old = 'BarChart3, Menu, Mail, LockKeyhole, LogIn, UserPlus, LogOut, Trophy'
          new = 'BarChart3, Menu, Mail, LockKeyhole, LogIn, UserPlus, LogOut, Trophy, FileText'
          if old in s and 'Trophy, FileText' not in s:
              s = s.replace(old, new, 1)
          old_props = '{tab==="profile"&&<Profile p={{copy,share,userId}}/>}'
          new_props = '{tab==="profile"&&<Profile p={{copy,share,userId,balance,notify}}/>}'
          if old_props not in s:
              raise SystemExit('Profile props pattern not found')
          s = s.replace(old_props, new_props, 1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/PointProApp.tsx
          git commit -m 'Fix Profile crash' || exit 0
          git push
